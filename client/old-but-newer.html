<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nara.io</title>

        <link data-trunk rel="rust" data-wasm-opt="z" />
        <link data-trunk rel="copy-dir" href="assets" />

        <style>
            @font-face {
                font-family: "Exo 2";
                src: url("./assets/Exo2.ttf") format("truetype");
                font-weight: 100 400 600 800 900;
                font-style: normal;
            }
            * {
                font-family:
                    "Exo 2",
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Oxygen,
                    Ubuntu,
                    Cantarell,
                    "Open Sans",
                    "Helvetica Neue",
                    sans-serif;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            #gameCanvas {
                width: 100vw;
                height: 100vh;
                display: none;
            }

            #background {
                position: fixed;
                inset: 0;

                background-image: url("./assets/banner_2.png");
                background-size: cover;
                background-position: center;

                z-index: 1;

                will-change: transform;
            }

            .screen-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);
                z-index: 9;
                backdrop-filter: blur(4px);
            }

            #mainMenu {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;

                width: 100%;
                height: 100%;

                z-index: 11;
            }

            #nameInput {
                width: 26rem;
                height: 3rem;
                border: 2.25px solid rgba(0, 0, 0, 0.25);
                border-radius: calc(1 * 0.28rem);
                margin: 0;
                font-size: 22px;
                outline: none;
                cursor: pointer;
                font-weight: 500;
                padding: 8px;
            }

            #playButton {
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #72C36E;
                width: 26rem;
                height: 3rem;
                padding: 8px;
                border: 2.25px solid rgba(0, 0, 0, 0.25);
                border-radius: calc(1 * 0.28rem);
                text-align: center;
                vertical-align: middle;
                font-weight: 500;
                font-size: 30px;
                letter-spacing: 2px;
                color: white;
                text-shadow:
                    calc(0.18em / 8) calc(0.18em / 8) 0 #393939,
                    calc(0.18em / -8) calc(0.18em / 8) 0 #393939,
                    calc(0.18em / 8) calc(0.18em / -8) 0 #393939,
                    calc(0.18em / -8) calc(0.18em / -8) 0 #393939,
                    0 calc(0.18em / 8) 0 #393939,
                    0 calc(0.18em / -8) 0 #393939,
                    calc(0.18em / -8) 0 0 #393939,
                    calc(0.18em / 8) 0 0 #393939,
                    calc(0.18em / 4) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / 4) calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / -4) 0 #393939,
                    0 calc(0.18em / 4) 0 #393939,
                    0 calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -4) 0 0 #393939,
                    calc(0.18em / 4) 0 0 #393939,
                    calc(0.18em / 8) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / -8) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / 8) calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -8) calc(0.18em / -4) 0 #393939,
                    calc(0.18em / 4) calc(0.18em / 8) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / 8) 0 #393939,
                    calc(0.18em / 4) calc(0.18em / -8) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / -8) 0 #393939;

                /*text-shadow:
                    calc(0.18em / 4) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / 4) calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / -4) 0 #393939,
                    0 calc(0.18em / 4) 0 #393939,
                    0 calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -4) 0 0 #393939,
                    calc(0.18em / 4) 0 0 #393939,
                    calc(0.18em / 2) calc(0.18em / 2) 0 #393939,
                    calc(0.18em / -2) calc(0.18em / 2) 0 #393939,
                    calc(0.18em / 2) calc(0.18em / -2) 0 #393939,
                    calc(0.18em / -2) calc(0.18em / -2) 0 #393939,
                    0 calc(0.18em / 2) 0 #393939,
                    0 calc(0.18em / -2) 0 #393939,
                    calc(0.18em / -2) 0 0 #393939,
                    calc(0.18em / 2) 0 0 #393939,
                    calc(0.18em / 4) calc(0.18em / 2) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / 2) 0 #393939,
                    calc(0.18em / 4) calc(0.18em / -2) 0 #393939,
                    calc(0.18em / -4) calc(0.18em / -2) 0 #393939,
                    calc(0.18em / 2) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / -2) calc(0.18em / 4) 0 #393939,
                    calc(0.18em / 2) calc(0.18em / -4) 0 #393939,
                    calc(0.18em / -2) calc(0.18em / -4) 0 #393939;*/
            }
        </style>
    </head>
    <body>
        <div id="background"></div>
        <div class="screen-overlay"></div>

        <div id="mainMenu">
            <input
                id="nameInput"
                placeholder="Enter Nickname..."
                maxlength="30"
            />

            <div id="playButton">
                <div>Play</div>
            </div>
        </div>

        <canvas id="gameCanvas"
            >graphics arent supported on your browser...</canvas
        >

        <script>
            document
                .getElementById("playButton")
                .addEventListener("click", () => {
                    document.getElementById("gameCanvas").style.display =
                        "block";
                    document.getElementById("background").style.display =
                        "none";
                    document.querySelector(".screen-overlay").style.display =
                        "none";
                    document.getElementById("mainMenu").style.display = "none";
                });

            const bg = document.getElementById("background");

            let targetX = 0;
            let targetY = 0;

            let currentX = 0;
            let currentY = 0;

            let lastTime = performance.now();

            const SMOOTHING_SPEED = 4.5;

            document.addEventListener("mousemove", (e) => {
                targetX = (e.clientX / window.innerWidth - 0.5) * 150;
                targetY = (e.clientY / window.innerHeight - 0.5) * 150;
            });

            function animate(now) {
                const dt = Math.min((now - lastTime) / 1000, 0.1);
                lastTime = now;

                const factor = 1 - Math.exp(-SMOOTHING_SPEED * dt);

                currentX += (targetX - currentX) * factor;
                currentY += (targetY - currentY) * factor;

                bg.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) scale(1.15)`;

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        </script>
    </body>
</html>
